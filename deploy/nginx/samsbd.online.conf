# Nginx site config for samsbd.online ONLY — safe on multi-site VPS.
# Does NOT modify other sites. Always: sudo nginx -t before reload.
#
# Install: sudo cp deploy/nginx/samsbd.online.conf /etc/nginx/sites-available/samsbd.online
#          sudo ln -sf /etc/nginx/sites-available/samsbd.online /etc/nginx/sites-enabled/samsbd.online
#          sudo nginx -t && sudo systemctl reload nginx
#
# SSL (this domain only): sudo certbot --nginx -d samsbd.online -d www.samsbd.online
# DO NOT: rm other sites-enabled symlinks, pm2 delete all, or certbot without -d

upstream samsbd_attendance_api {
    server 127.0.0.1:3003;
    keepalive 32;
}

# Redirect HTTP → HTTPS (enable after certbot, or use certbot's auto-config)
server {
    listen 80;
    listen [::]:80;
    server_name samsbd.online www.samsbd.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name samsbd.online www.samsbd.online;

    # Certbot will fill these paths after: certbot --nginx -d samsbd.online -d www.samsbd.online
    ssl_certificate     /etc/letsencrypt/live/samsbd.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samsbd.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/samsbd.online/client/dist;
    index index.html;

    client_max_body_size 12M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → PM2 backend (port 3003)
    location /api/ {
        proxy_pass http://samsbd_attendance_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Local avatar uploads (when Cloudinary is not configured)
    location /uploads/ {
        proxy_pass http://samsbd_attendance_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
