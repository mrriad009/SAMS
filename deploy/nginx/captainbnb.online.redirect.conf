# Optional: send the old domain to samsbd.online.
# Requires the existing captainbnb.online certificate to still be on the server.
#
# sudo cp deploy/nginx/captainbnb.online.redirect.conf /etc/nginx/sites-available/captainbnb.online
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name captainbnb.online www.captainbnb.online;
    return 301 https://samsbd.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name captainbnb.online www.captainbnb.online;

    ssl_certificate     /etc/letsencrypt/live/captainbnb.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/captainbnb.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://samsbd.online$request_uri;
}
