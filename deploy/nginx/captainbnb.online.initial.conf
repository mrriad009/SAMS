# HTTP-only bootstrap for captainbnb.online — safe alongside other nginx sites.
# DO NOT remove other files in sites-enabled/.
#
# sudo cp deploy/nginx/captainbnb.online.initial.conf /etc/nginx/sites-available/captainbnb.online
# sudo ln -sf /etc/nginx/sites-available/captainbnb.online /etc/nginx/sites-enabled/captainbnb.online
# sudo nginx -t && sudo systemctl reload nginx
# sudo certbot --nginx -d captainbnb.online -d www.captainbnb.online

upstream captainbnb_attendance_api {
    server 127.0.0.1:3003;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name captainbnb.online www.captainbnb.online;

    root /var/www/captainbnb.online/client/dist;
    index index.html;

    client_max_body_size 12M;

    location /api/ {
        proxy_pass http://captainbnb_attendance_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://captainbnb_attendance_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
